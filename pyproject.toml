[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia"
version = "0.1.0"
description = "Resilient institutional memory for AI agent fleets, on CockroachDB + AWS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Aletheia contributors" }]
keywords = ["agentic-memory", "cockroachdb", "aws", "bedrock", "multi-agent"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

# Runtime dependencies of the whole system. NOTE: `core/` must not import any of
# the infrastructure ones (boto3, psycopg) — enforced by tests/test_architecture.py.
dependencies = [
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/manuelpz/aletheia"
Repository = "https://github.com/manuelpz/aletheia"

[tool.setuptools]
packages = [
    "core",
    "adapters",
    "ingest",
    "agents",
    "scenarios",
    "experiments",
    "chaos",
    "lambdas",
    "demoapp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: touches a real CockroachDB cluster; skipped without credentials",
    "aws: touches real AWS services (Bedrock/S3); skipped without credentials",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
# Ruff formats Python code blocks inside Markdown. CLAUDE.md is the source of
# truth for this project and its §7 contract block is quoted verbatim — a
# formatter must never rewrite it. Documentation is prose, not build output.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "adapters", "ingest", "agents", "experiments", "scenarios"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
